l_english:
 ###Londinium
londinium_mission_01_political:0 "Restitutio Londinium"
londinium_mission_01_political_DESCRIPTION:0"The Western Roman Empire has fallen, and Britannia has been left to fend for itself. Yet, from the ruins of Londinium, a spark of hope remains. Under the leadership of Ambrosius Aurelianus, we can reclaim our heritage and restore Roman glory to Britannia."
londinium_mission_01_political_CRITERIA_DESCRIPTION:0 "Protect the legacy of Rome and secure the Eastern Empire future as a hegemonic power."